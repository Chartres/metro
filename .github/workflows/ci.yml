# Flywheel Standard — canonical CI gate (Flywheel Standard §2), stamped from
# flywheel/docs/standards/ci.template.yml. Blocks ONLY on truth: typecheck,
# test, build, e2e. No deploy job here: Cloudflare Pages' Git integration
# builds and deploys main itself (wired by the hub's connect-pages workflow).
name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build
        env: # the shared flywheel-core platform env — same names in every web product
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
